name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.11" }
      - name: DuckDB CLI
        run: curl -sSfL https://github.com/duckdb/duckdb/releases/download/v2.0.1/duckdb-cli-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin duckdb
      - run: make vet test
      - run: make e2e
      - name: govulncheck (known vulnerabilities in Gjallar's own dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
