# OpenSSF Scorecard: supply-chain security checks, published to the Scorecard API.
name: scorecard
on:
  push: { branches: [main] }
  schedule: [{ cron: "23 4 * * 1" }]
permissions: read-all
jobs:
  analysis:
    # Scorecard analyses public repositories (the default token can't read a private
    # repo's GraphQL API). It starts running automatically when the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, security-events: write, id-token: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with: { results_file: results.sarif, results_format: sarif, publish_results: "${{ !github.event.repository.private }}" }  # the public Scorecard API only accepts public repos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: scorecard, path: results.sarif, retention-days: 5 }
      - if: ${{ !github.event.repository.private }}  # code scanning needs GitHub Advanced Security on private repos
        uses: github/codeql-action/upload-sarif@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.2
        with: { sarif_file: results.sarif }
